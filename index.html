<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ おえかきバトル ✨</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            background: linear-gradient(135deg, #fce7f3 0%, #e0e7ff 100%);
            touch-action: manipulation;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4 text-gray-800 select-none">

    <!-- ヘッダー -->
    <header class="w-full max-w-md text-center py-2">
        <h1 class="text-3xl font-extrabold text-pink-500 drop-shadow-md">✨ おえかきバトル ✨</h1>
        <p class="text-sm text-indigo-600 font-bold mt-1">じぶんのえでバトルしよう！</p>
    </header>

    <!-- メインコンテンツエリア -->
    <main class="w-full max-w-md bg-white/90 backdrop-blur-md rounded-3xl shadow-xl p-6 flex flex-col items-center justify-center my-auto min-h-[450px]">

        <!-- 1. ホーム画面 -->
        <div id="view-home" class="flex flex-col items-center w-full">
            <div class="text-6xl mb-4 animate-bounce">🎨⚔️</div>
            <p class="text-center text-gray-600 mb-6 font-bold text-sm">
                かいた絵の写真を撮るか選んで、<br>音声で名前をつけてバトルしよう！
            </p>
            <button onclick="goToUpload()" class="w-full bg-pink-500 hover:bg-pink-600 text-white font-extrabold text-xl py-4 rounded-full shadow-lg transform active:scale-95 transition">
                ゲームをはじめる！
            </button>
        </div>

        <!-- 2. アップロード・撮影＆音声入力画面 -->
        <div id="view-upload" class="hidden flex flex-col items-center w-full">
            <h2 class="text-xl font-bold text-indigo-600 mb-3">キャラをしょうかいしてね！</h2>
            
            <!-- 写真選択・カメラ撮影ボタン -->
            <div class="flex gap-2 w-full mb-4">
                <label class="flex-1 border-2 border-dashed border-pink-300 rounded-2xl p-4 flex flex-col items-center justify-center bg-pink-50 cursor-pointer hover:bg-pink-100 transition">
                    <span class="text-2xl mb-1">📷</span>
                    <span class="text-xs font-bold text-pink-500">写真を撮る</span>
                    <input type="file" id="cameraInput" accept="image/*" capture="environment" class="hidden" onchange="onImageSelected(event)">
                </label>
                <label class="flex-1 border-2 border-dashed border-indigo-300 rounded-2xl p-4 flex flex-col items-center justify-center bg-indigo-50 cursor-pointer hover:bg-indigo-100 transition">
                    <span class="text-2xl mb-1">🖼️</span>
                    <span class="text-xs font-bold text-indigo-500">画像を選ぶ</span>
                    <input type="file" id="imageInput" accept="image/*" class="hidden" onchange="onImageSelected(event)">
                </label>
            </div>

            <!-- プレビューと音声入力 -->
            <div id="previewContainer" class="hidden flex flex-col items-center w-full">
                <img id="imagePreview" class="w-24 h-24 object-contain border-2 border-indigo-300 rounded-xl bg-white shadow-md mb-3">
                
                <!-- 音声入力エリア -->
                <div class="w-full bg-indigo-50 rounded-2xl p-3 mb-4 flex flex-col items-center">
                    <p class="text-xs font-bold text-indigo-600 mb-2">🎤 マイクに向かって名前や必殺技を言ってね！</p>
                    <div class="flex gap-2 w-full">
                        <button onclick="startVoiceInput()" id="micBtn" class="flex-1 bg-indigo-500 hover:bg-indigo-600 text-white font-bold text-xs py-2 px-3 rounded-full shadow transition">
                            音声入力をはじめる
                        </button>
                    </div>
                    <input type="text" id="charNameInput" placeholder="キャラ名（例: ぽよまる）" class="w-full mt-2 text-center text-sm font-bold border border-indigo-200 rounded-xl py-1 px-2 bg-white outline-none focus:ring-2 focus:ring-indigo-400">
                </div>

                <button onclick="goToGame()" class="w-full bg-pink-500 hover:bg-pink-600 text-white font-extrabold text-lg py-3 rounded-full shadow-lg transform active:scale-95 transition">
                    バトルへすすむ！
                </button>
            </div>
        </div>

        <!-- 3. バトル画面 -->
        <div id="view-game" class="hidden flex flex-col items-center w-full relative">
            <div class="flex justify-between w-full mb-1 px-2 text-xs font-bold text-gray-600">
                <span>HP: <span id="playerHp" class="text-green-500 text-base">100</span></span>
                <span id="displayCharName" class="text-indigo-600 font-extrabold">マイキャラ</span>
                <span>てき HP: <span id="enemyHp" class="text-red-500 text-base">100</span></span>
            </div>
            
            <!-- バトル用キャンバス -->
            <canvas id="gameCanvas" width="300" height="240" class="bg-indigo-900 rounded-2xl shadow-inner border-4 border-indigo-300"></canvas>
            
            <!-- アクションボタン -->
            <div class="flex gap-2 w-full mt-3">
                <button onclick="playerAttack()" class="flex-1 bg-pink-500 hover:bg-pink-600 text-white font-extrabold py-2 rounded-full shadow text-sm active:scale-95 transition">
                    ⚔️ こうげき！
                </button>
                <button onclick="playerSpecial()" class="flex-1 bg-amber-500 hover:bg-amber-600 text-white font-extrabold py-2 rounded-full shadow text-sm active:scale-95 transition">
                    🔥 ひっさつわざ！
                </button>
            </div>

            <button onclick="backToHome()" class="mt-2 text-gray-400 hover:text-gray-600 text-xs font-bold py-1">
                ホームにもどる
            </button>
        </div>

    </main>

    <footer class="w-full max-w-md text-center text-xs text-gray-500 py-2">
        &copy; 2026 おえかきバトル プロトタイプ
    </footer>

    <!-- スクリプト制御 -->
    <script>
        let characterImage = null;
        let playerHp = 100, enemyHp = 100;
        let playerX = 60, enemyX = 200;
        let isAttacking = false;
        let animationFrameId = null;

        function goToUpload() {
            switchView('view-upload');
        }

        function switchView(viewId) {
            document.getElementById('view-home').classList.add('hidden');
            document.getElementById('view-upload').classList.add('hidden');
            document.getElementById('view-game').classList.add('hidden');
            document.getElementById(viewId).classList.remove('hidden');
        }

        function onImageSelected(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        characterImage = img;
                        document.getElementById('imagePreview').src = e.target.result;
                        document.getElementById('previewContainer').classList.remove('hidden');
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        }

        // 音声入力（Web Speech API）
        function startVoiceInput() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert('お使いのブラウザは音声入力に対応していません。手動で入力してね！');
                return;
            }
            const recognition = new SpeechRecognition();
            recognition.lang = 'ja-JP';
            const micBtn = document.getElementById('micBtn');
            micBtn.innerText = "Listening... 🎤";
            micBtn.classList.add('bg-red-500');

            recognition.onresult = function(event) {
                const transcript = event.results[0][0].transcript;
                document.getElementById('charNameInput').value = transcript;
                micBtn.innerText = "音声入力をはじめる";
                micBtn.classList.remove('bg-red-500');
            };

            recognition.onerror = function() {
                micBtn.innerText = "音声入力をはじめる";
                micBtn.classList.remove('bg-red-500');
            };

            recognition.start();
        }

        function goToGame() {
            const nameInput = document.getElementById('charNameInput').value;
            document.getElementById('displayCharName').innerText = nameInput ? nameInput : "マイキャラ";

            switchView('view-game');
            startBattle();
        }

        function startBattle() {
            playerHp = 100;
            enemyHp = 100;
            playerX = 60;
            enemyX = 200;
            updateHpDisplay();

            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');

            function loop() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                // 背景ステージ
                ctx.fillStyle = "#312e81";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#4338ca";
                ctx.fillRect(0, 180, canvas.width, 60); // 床

                // プレイヤーキャラ描画
                if (characterImage) {
                    ctx.drawImage(characterImage, playerX, 110, 60, 60);
                } else {
                    ctx.fillStyle = "#ec4899";
                    ctx.fillRect(playerX, 110, 50, 50);
                }

                // 敵キャラ描画
                ctx.fillStyle = "#ef4444";
                ctx.beginPath();
                ctx.arc(enemyX + 25, 145, 25, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = "#fff";
                ctx.font = "12px sans-serif";
                ctx.fillText("敵ボス", enemyX + 10, 105);

                animationFrameId = requestAnimationFrame(loop);
            }

            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            loop();
        }

        function playerAttack() {
            if (isAttacking) return;
            isAttacking = true;
            playerX += 40;

            setTimeout(() => {
                enemyHp = Math.max(0, enemyHp - 20);
                updateHpDisplay();
                playerX -= 40;
                isAttacking = false;
                checkBattleEnd();
                if (enemyHp > 0) enemyTurn();
            }, 200);
        }

        function playerSpecial() {
            if (isAttacking) return;
            isAttacking = true;
            playerX += 70;

            setTimeout(() => {
                enemyHp = Math.max(0, enemyHp - 45);
                updateHpDisplay();
                playerX -= 70;
                isAttacking = false;
                checkBattleEnd();
                if (enemyHp > 0) enemyTurn();
            }, 300);
        }

        function enemyTurn() {
            setTimeout(() => {
                playerHp = Math.max(0, playerHp - 15);
                updateHpDisplay();
                checkBattleEnd();
            }, 600);
        }

        function updateHpDisplay() {
            document.getElementById('playerHp').innerText = playerHp;
            document.getElementById('enemyHp').innerText = enemyHp;
        }

        function checkBattleEnd() {
            if (enemyHp <= 0) {
                alert("🎉 ゆうしゃのしょうり！ おめでとう！");
                backToHome();
            } else if (playerHp <= 0) {
                alert("💥 まけてしまった… もういちどちょうせんしよう！");
                backToHome();
            }
        }

        function backToHome() {
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            switchView('view-home');
        }
    </script>
</body>
</html>
