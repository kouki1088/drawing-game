<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>おえかきバトル！</title>
    <!-- Tailwind CSS CDNでポップで可愛いデザインに -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            background: linear-gradient(135deg, #fce7f3 0%, #e0e7ff 100%);
            touch-action: manipulation;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4 text-gray-800 select-none">

    <!-- ヘッダー -->
    <header class="w-full max-w-md text-center py-2">
        <h1 class="text-3xl font-extrabold text-pink-500 drop-shadow-md">✨ おえかきバトル ✨</h1>
        <p class="text-sm text-indigo-600 font-bold mt-1">じぶんのえをうごかしてあそぼう！</p>
    </header>

    <!-- メインコンテンツエリア -->
    <main class="w-full max-w-md bg-white/80 backdrop-blur-md rounded-3xl shadow-xl p-6 flex flex-col items-center justify-center my-auto min-h-[400px]">

        <!-- 1. ホーム画面 -->
        <div id="view-home" class="flex flex-col items-center w-full">
            <div class="text-6xl mb-4 animate-bounce">🎨</div>
            <p class="text-center text-gray-600 mb-6 font-bold text-sm">
                かいた絵の写真をアップロードして、<br>ゲームの世界でパタパタ動かそう！
            </p>
            <button onclick="handleStartClick()" class="w-full bg-pink-500 hover:bg-pink-600 text-white font-extrabold text-xl py-4 rounded-full shadow-lg transform active:scale-95 transition">
                ゲームをはじめる！
            </button>
        </div>

        <!-- 2. アップロード画面 -->
        <div id="view-upload" class="hidden flex flex-col items-center w-full">
            <h2 class="text-xl font-bold text-indigo-600 mb-4">キャラの絵をえらんでね！</h2>
            <label class="w-full border-4 border-dashed border-pink-300 rounded-2xl p-6 flex flex-col items-center justify-center bg-pink-50 cursor-pointer hover:bg-pink-100 transition">
                <span class="text-4xl mb-2">📷</span>
                <span class="text-sm font-bold text-pink-500">写真ファイルを選ぶ</span>
                <input type="file" id="imageInput" accept="image/*" class="hidden" onchange="onImageSelected(event)">
            </label>
            <div id="previewContainer" class="mt-4 hidden flex flex-col items-center w-full">
                <img id="imagePreview" class="w-28 h-28 object-contain border-2 border-indigo-300 rounded-xl bg-white shadow-md mb-4">
                <button onclick="goToGame()" class="w-full bg-indigo-500 hover:bg-indigo-600 text-white font-extrabold text-lg py-3 rounded-full shadow-lg transform active:scale-95 transition">
                    バトルスタート！
                </button>
            </div>
        </div>

        <!-- 3. ゲーム（バトル）画面 -->
        <div id="view-game" class="hidden flex flex-col items-center w-full relative">
            <div class="flex justify-between w-full mb-2 px-2 text-sm font-bold text-gray-600">
                <span>スコア: <span id="score" class="text-pink-500 text-lg">0</span></span>
                <span id="charName" class="text-indigo-600">マイキャラ</span>
            </div>
            <!-- キャラが動き回るキャンバス -->
            <canvas id="gameCanvas" width="300" height="300" class="bg-indigo-900 rounded-2xl shadow-inner border-4 border-indigo-300 cursor-pointer"></canvas>
            <p class="text-xs text-gray-400 mt-2 text-center">キャラをタップするとジャンプするよ！</p>
            <button onclick="backToHome()" class="mt-4 bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold py-2 px-6 rounded-full text-sm">
                ホームにもどる
            </button>
        </div>

    </main>

    <!-- 広告ポップアップモック（2回目以降用） -->
    <div id="adModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-3xl p-6 max-w-xs w-full text-center shadow-2xl animate-scale-up">
            <div class="text-4xl mb-2">📺</div>
            <h3 class="text-lg font-extrabold text-gray-800 mb-2">動画をみよう！</h3>
            <p class="text-xs text-gray-500 mb-6">
                2回目以降に新しいキャラを作るには、動画をみてね！（モック広告）
            </p>
            <button onclick="watchAd()" class="w-full bg-green-500 hover:bg-green-600 text-white font-extrabold py-3 rounded-full shadow-md mb-2">
                ▶ 動画をみたよ！（すすむ）
            </button>
            <button onclick="closeAdModal()" class="text-gray-400 text-xs font-bold py-1">
                やめる
            </button>
        </div>
    </div>

    <!-- フッター -->
    <footer class="w-full max-w-md text-center text-xs text-gray-500 py-2">
        &copy; 2026 おえかきバトル プロトタイプ
    </footer>

    <!-- ゲーム＆アプリ制御のJavaScript -->
    <script>
        let characterImage = null;
        let charX = 150, charY = 150;
        let velX = 2, velY = 2;
        let score = 0;
        let animationFrameId = null;

        // 回数制限のチェックと画面切り替え
        function handleStartClick() {
            const count = parseInt(localStorage.getItem('drawingCount') || '0');
            if (count >= 1) {
                // 2回目以降は広告モックを表示
                document.getElementById('adModal').classList.remove('hidden');
            } else {
                // 初回はそのままアップロード画面へ
                switchView('view-upload');
            }
        }

        function closeAdModal() {
            document.getElementById('adModal').classList.add('hidden');
        }

        // 動画を視聴した（という擬似アクション）
        function watchAd() {
            closeAdModal();
            // カウントをリセット（あるいは増やす）
            localStorage.setItem('drawingCount', '0');
            switchView('view-upload');
        }

        function switchView(viewId) {
            document.getElementById('view-home').classList.add('hidden');
            document.getElementById('view-upload').classList.add('hidden');
            document.getElementById('view-game').classList.add('hidden');
            document.getElementById(viewId).classList.remove('hidden');
        }

        function onImageSelected(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        characterImage = img;
                        document.getElementById('imagePreview').src = e.target.result;
                        document.getElementById('previewContainer').classList.remove('hidden');
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        }

        function goToGame() {
            // 使用回数を記録
            let count = parseInt(localStorage.getItem('drawingCount') || '0');
            localStorage.setItem('drawingCount', count + 1);

            switchView('view-game');
            startCanvasGame();
        }

        function startCanvasGame() {
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            charX = canvas.width / 2;
            charY = canvas.height / 2;
            score = 0;

            // タップでジャンプ（跳ねる）
            canvas.onclick = function() {
                velY = -6;
                score += 10;
                document.getElementById('score').innerText = score;
            };

            function loop() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                // 重力と移動
                velY += 0.2; // 重力
                charX += velX;
                charY += velY;

                // 壁の跳ね返り
                if (charX < 25 || charX > canvas.width - 25) {
                    velX *= -1;
                }
                if (charY < 25) {
                    charY = 25;
                    velY *= -0.8;
                }
                if (charY > canvas.height - 25) {
                    charY = canvas.height - 25;
                    velY = -5; // 床でバウンド
                }

                // キャラクターの描画
                if (characterImage) {
                    ctx.save();
                    ctx.translate(charX, charY);
                    ctx.drawImage(characterImage, -30, -30, 60, 60);
                    ctx.restore();
                }

                animationFrameId = requestAnimationFrame(loop);
            }

            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            loop();
        }

        function backToHome() {
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            switchView('view-home');
        }
    </script>
</body>
</html>
