<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ おえかきモンスターハンター ✨</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
            touch-action: manipulation;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4 text-white select-none">

    <!-- ヘッダー -->
    <header class="w-full max-w-md text-center py-2">
        <h1 class="text-3xl font-extrabold text-amber-400 drop-shadow-lg">⚔️ おえかきハンター 🛡️</h1>
        <p class="text-xs text-indigo-200 font-bold mt-1">きみの絵で巨大モンスターを討伐せよ！</p>
    </header>

    <!-- メインコンテンツエリア -->
    <main class="w-full max-w-md bg-slate-900/90 backdrop-blur-md rounded-3xl shadow-2xl border border-indigo-500/30 p-6 flex flex-col items-center justify-center my-auto min-h-[480px]">

        <!-- 1. ホーム画面 -->
        <div id="view-home" class="flex flex-col items-center w-full">
            <div class="text-6xl mb-4 animate-bounce">🐲🗡️</div>
            <p class="text-center text-indigo-200 mb-6 font-bold text-sm leading-relaxed">
                装備（絵）の写真を撮るか選んで、<br>ハンターの名前を呼んで出発しよう！
            </p>
            <button onclick="goToUpload()" class="w-full bg-gradient-to-r from-amber-500 to-orange-600 hover:from-amber-600 hover:to-orange-700 text-white font-extrabold text-xl py-4 rounded-full shadow-lg transform active:scale-95 transition">
                クエストに出発！
            </button>
        </div>

        <!-- 2. キャラクター作成・撮影＆音声入力画面 -->
        <div id="view-upload" class="hidden flex flex-col items-center w-full">
            <h2 class="text-lg font-bold text-amber-300 mb-3">ハンターの装具を整えよう！</h2>
            
            <!-- 写真選択・カメラ撮影ボタン -->
            <div class="flex gap-2 w-full mb-4">
                <label class="flex-1 border-2 border-dashed border-amber-400/50 rounded-2xl p-4 flex flex-col items-center justify-center bg-slate-800/80 cursor-pointer hover:bg-slate-800 transition">
                    <span class="text-2xl mb-1">📷</span>
                    <span class="text-xs font-bold text-amber-300">写真を撮る</span>
                    <input type="file" id="cameraInput" accept="image/*" capture="environment" class="hidden" onchange="onImageSelected(event)">
                </label>
                <label class="flex-1 border-2 border-dashed border-indigo-400/50 rounded-2xl p-4 flex flex-col items-center justify-center bg-slate-800/80 cursor-pointer hover:bg-slate-800 transition">
                    <span class="text-2xl mb-1">🖼️</span>
                    <span class="text-xs font-bold text-indigo-300">画像を選ぶ</span>
                    <input type="file" id="imageInput" accept="image/*" class="hidden" onchange="onImageSelected(event)">
                </label>
            </div>

            <!-- プレビューと音声入力 -->
            <div id="previewContainer" class="hidden flex flex-col items-center w-full">
                <img id="imagePreview" class="w-24 h-24 object-contain border-2 border-amber-400 rounded-xl bg-slate-900 shadow-md mb-3">
                
                <!-- 音声入力エリア -->
                <div class="w-full bg-slate-800/90 rounded-2xl p-3 mb-4 flex flex-col items-center border border-indigo-500/30">
                    <p class="text-xs font-bold text-indigo-300 mb-2">🎤 マイクに向かってハンター名を言ってね！</p>
                    <div class="flex gap-2 w-full">
                        <button onclick="startVoiceInput()" id="micBtn" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs py-2 px-3 rounded-full shadow transition">
                            音声入力をはじめる
                        </button>
                    </div>
                    <input type="text" id="charNameInput" placeholder="ハンター名（例: ゆうしゃ）" class="w-full mt-2 text-center text-sm font-bold border border-indigo-500/40 rounded-xl py-1 px-2 bg-slate-900 text-white outline-none focus:ring-2 focus:ring-amber-400">
                </div>

                <button onclick="goToGame()" class="w-full bg-gradient-to-r from-amber-500 to-orange-600 hover:from-amber-600 hover:to-orange-700 text-white font-extrabold text-lg py-3 rounded-full shadow-lg transform active:scale-95 transition">
                    討伐戦を開始する！
                </button>
            </div>
            
            <button onclick="backToHome()" class="mt-3 text-indigo-400 hover:text-indigo-200 text-xs font-bold py-1">
                キャンプに戻る
            </button>
        </div>

        <!-- 3. バトル画面（モンハン風） -->
        <div id="view-game" class="hidden flex flex-col items-center w-full relative">
            <!-- ステータスバー（HP） -->
            <div class="w-full mb-2 bg-slate-800 p-2 rounded-xl border border-indigo-500/30 flex flex-col gap-1">
                <div class="flex justify-between text-xs font-bold">
                    <span id="displayCharName" class="text-amber-400">ハンター</span>
                    <span>HP: <span id="playerHp" class="text-green-400 text-sm">100</span> / 100</span>
                </div>
                <div class="w-full bg-slate-700 h-2 rounded-full overflow-hidden">
                    <div id="playerHpBar" class="bg-green-500 h-full w-full transition-all duration-300"></div>
                </div>
                
                <div class="flex justify-between text-xs font-bold mt-1">
                    <span class="text-red-400">討伐対象：ドス・モンスター</span>
                    <span>HP: <span id="enemyHp" class="text-red-400 text-sm">150</span> / 150</span>
                </div>
                <div class="w-full bg-slate-700 h-2 rounded-full overflow-hidden">
                    <div id="enemyHpBar" class="bg-red-500 h-full w-full transition-all duration-300"></div>
                </div>
            </div>
            
            <!-- バトル用フィールド（キャンバス） -->
            <canvas id="gameCanvas" width="300" height="200" class="bg-slate-950 rounded-2xl shadow-inner border-2 border-amber-500/50 mb-3"></canvas>
            
            <!-- アクションボタン（狩り技） -->
            <div class="flex gap-2 w-full">
                <button onclick="playerAttack()" class="flex-1 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-extrabold py-3 rounded-full shadow text-sm active:scale-95 transition flex items-center justify-center gap-1">
                    ⚔️ 斬撃 (こうげき)
                </button>
                <button onclick="playerSpecial()" class="flex-1 bg-gradient-to-r from-amber-500 to-red-600 hover:from-amber-600 hover:to-red-700 text-white font-extrabold py-3 rounded-full shadow text-sm active:scale-95 transition flex items-center justify-center gap-1">
                    🔥 必殺の一撃
                </button>
            </div>

            <button onclick="backToHome()" class="mt-3 text-indigo-400 hover:text-indigo-200 text-xs font-bold py-1">
                キャンプに戻る
            </button>
        </div>

    </main>

    <footer class="w-full max-w-md text-center text-xs text-indigo-300/70 py-2">
        &copy; 2026 おえかきモンスターハンター
    </footer>

    <!-- スクリプト制御 -->
    <script>
        let characterImage = null;
        let playerHp = 100, maxPlayerHp = 100;
        let enemyHp = 150, maxEnemyHp = 150;
        let playerX = 50, enemyX = 210;
        let isAttacking = false;
        let battleMessage = "モンスターが現れた！";
        let animationFrameId = null;

        function goToUpload() {
            switchView('view-upload');
        }

        function switchView(viewId) {
            document.getElementById('view-home').classList.add('hidden');
            document.getElementById('view-upload').classList.add('hidden');
            document.getElementById('view-game').classList.add('hidden');
            document.getElementById(viewId).classList.remove('hidden');
        }

        function onImageSelected(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        characterImage = img;
                        document.getElementById('imagePreview').src = e.target.result;
                        document.getElementById('previewContainer').classList.remove('hidden');
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        }

        // 音声入力（Web Speech API）
        function startVoiceInput() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert('お使いのブラウザは音声入力に対応していません。手動で入力してね！');
                return;
            }
            const recognition = new SpeechRecognition();
            recognition.lang = 'ja-JP';
            const micBtn = document.getElementById('micBtn');
            micBtn.innerText = "Listening... 🎤";
            micBtn.classList.add('bg-red-600');

            recognition.onresult = function(event) {
                const transcript = event.results[0][0].transcript;
                document.getElementById('charNameInput').value = transcript;
                micBtn.innerText = "音声入力をはじめる";
                micBtn.classList.remove('bg-red-600');
            };

            recognition.onerror = function() {
                micBtn.innerText = "音声入力をはじめる";
                micBtn.classList.remove('bg-red-600');
            };

            recognition.start();
        }

        function goToGame() {
            const nameInput = document.getElementById('charNameInput').value;
            document.getElementById('displayCharName').innerText = nameInput ? nameInput : "ハンター";

            switchView('view-game');
            startBattle();
        }

        function startBattle() {
            playerHp = 100;
            enemyHp = 150;
            playerX = 50;
            enemyX = 210;
            battleMessage = "モンスターと遭遇！";
            updateHpDisplay();

            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');

            function loop() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                // 背景（フィールド・夜の闘技場風）
                ctx.fillStyle = "#0f172a";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#1e293b";
                ctx.fillRect(0, 150, canvas.width, 50); // 地面

                // 討伐対象モンスター（ドラゴン風のシルエット＆目）
                ctx.fillStyle = "#b91c1c";
                ctx.beginPath();
                ctx.arc(enemyX + 20, 115, 30, 0, Math.PI * 2);
                ctx.fill();
                // モンスターの目
                ctx.fillStyle = "#facc15";
                ctx.fillRect(enemyX + (isAttacking ? 10 : 25), 105, 8, 4);

                // プレイヤーハンター描画
                if (characterImage) {
                    ctx.drawImage(characterImage, playerX, 90, 55, 55);
                } else {
                    ctx.fillStyle = "#f59e0b";
                    ctx.fillRect(playerX, 95, 40, 45);
                }

                // バトルメッセージ描画
                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 11px sans-serif";
                ctx.fillText(battleMessage, 15, 25);

                animationFrameId = requestAnimationFrame(loop);
            }

            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            loop();
        }

        function playerAttack() {
            if (isAttacking) return;
            isAttacking = true;
            playerX += 50;
            battleMessage = "ハンターの連続斬り！";

            setTimeout(() => {
                let damage = Math.floor(Math.random() * 10) + 18;
                enemyHp = Math.max(0, enemyHp - damage);
                updateHpDisplay();
                playerX -= 50;
                isAttacking = false;
                checkBattleEnd();
                if (enemyHp > 0) monsterTurn();
            }, 250);
        }

        function playerSpecial() {
            if (isAttacking) return;
            isAttacking = true;
            playerX += 80;
            battleMessage = "渾身のスーパー超特殊！";

            setTimeout(() => {
                let damage = Math.floor(Math.random() * 15) + 35;
                enemyHp = Math.max(0, enemyHp - damage);
                updateHpDisplay();
                playerX -= 80;
                isAttacking = false;
                checkBattleEnd();
                if (enemyHp > 0) monsterTurn();
            }, 350);
        }

        function monsterTurn() {
            setTimeout(() => {
                battleMessage = "モンスターの強烈な反撃！";
                let damage = Math.floor(Math.random() * 10) + 12;
                playerHp = Math.max(0, playerHp - damage);
                updateHpDisplay();
                checkBattleEnd();
            }, 600);
        }

        function updateHpDisplay() {
            document.getElementById('playerHp').innerText = playerHp;
            document.getElementById('playerHpBar').style.width = (playerHp / maxPlayerHp * 100) + "%";

            document.getElementById('enemyHp').innerText = enemyHp;
            document.getElementById('enemyHpBar').style.width = (enemyHp / maxEnemyHp * 100) + "%";
        }

        function checkBattleEnd() {
            if (enemyHp <= 0) {
                battleMessage = "討伐成功！大勝利！";
                alert("🎉 クエストクリア！ モンスターを討伐したぞ！");
                backToHome();
            } else if (playerHp <= 0) {
                battleMessage = "力尽きた…";
                alert("💥 力尽きてしまった… キャンプ送還！");
                backToHome();
            }
        }

        function backToHome() {
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            switchView('view-home');
        }
    </script>
</body>
</html>
